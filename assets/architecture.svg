<!-- ========== BOXES ========== -->
<!-- Frontend: Desktop workspace -->
<rect x="60" y="120" width="280" height="116" rx="16" fill="#0B1020"/>
<rect x="60" y="120" width="280" height="116" rx="16" fill="#0EA5E9" fill-opacity="0.12" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="200" y="164" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Desktop workspace</text>
<text x="200" y="188" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">Panes + terminal rendering</text>
<text x="200" y="216" font-family="Menlo, Consolas, monospace" font-size="11" fill="#0EA5E9" text-anchor="middle">GPUI or SwiftUI + AppKit</text>

<!-- Frontend: CLI + MCP -->
<rect x="1100" y="120" width="280" height="116" rx="16" fill="#0B1020"/>
<rect x="1100" y="120" width="280" height="116" rx="16" fill="#0EA5E9" fill-opacity="0.12" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="1240" y="164" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">CLI + MCP adapters</text>
<text x="1240" y="188" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">Scripts + agent tool calls</text>
<text x="1240" y="216" font-family="Menlo, Consolas, monospace" font-size="11" fill="#0EA5E9" text-anchor="middle">Same engine operations</text>

<!-- Backend: Local command API -->
<rect x="560" y="120" width="320" height="116" rx="16" fill="#0B1020"/>
<rect x="560" y="120" width="320" height="116" rx="16" fill="#FF1493" fill-opacity="0.12" stroke="#FF1493" stroke-width="1.5"/>
<text x="720" y="164" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Local command API</text>
<text x="720" y="188" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">Versioned requests + streams</text>
<text x="720" y="216" font-family="Menlo, Consolas, monospace" font-size="11" fill="#FF1493" text-anchor="middle">Restricted local socket</text>

<!-- Backend: Rust session engine -->
<rect x="560" y="400" width="320" height="116" rx="16" fill="#0B1020"/>
<rect x="560" y="400" width="320" height="116" rx="16" fill="#FF1493" fill-opacity="0.12" stroke="#FF1493" stroke-width="1.5"/>
<text x="720" y="444" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Rust session engine</text>
<text x="720" y="468" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">Lifecycle + schedules + tasks</text>
<text x="720" y="496" font-family="Menlo, Consolas, monospace" font-size="11" fill="#FF1493" text-anchor="middle">Enforce action policy</text>

<!-- Backend: PTY + terminal host -->
<rect x="560" y="650" width="320" height="116" rx="16" fill="#0B1020"/>
<rect x="560" y="650" width="320" height="116" rx="16" fill="#FF1493" fill-opacity="0.12" stroke="#FF1493" stroke-width="1.5"/>
<text x="720" y="694" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">PTY + terminal host</text>
<text x="720" y="718" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">Process I/O + terminal state</text>
<text x="720" y="746" font-family="Menlo, Consolas, monospace" font-size="11" fill="#FF1493" text-anchor="middle">Bounded buffers + reattach</text>

<!-- Database: Git worktrees -->
<rect x="60" y="400" width="280" height="116" rx="16" fill="#0B1020"/>
<rect x="60" y="400" width="280" height="116" rx="16" fill="#0EA5E9" fill-opacity="0.09"/>
<rect x="60" y="400" width="280" height="116" rx="16" fill="#FF1493" fill-opacity="0.09" stroke="#0EA5E9" stroke-width="1.5"/>
<rect x="60" y="400" width="280" height="116" rx="16" fill="none" stroke="#FF1493" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="200" y="444" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Git worktrees</text>
<text x="200" y="468" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">Isolated worker checkouts</text>
<text x="200" y="496" font-family="Menlo, Consolas, monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">Explicit workspace ownership</text>

<!-- Database: Local persistence -->
<rect x="1100" y="400" width="280" height="116" rx="16" fill="#0B1020"/>
<rect x="1100" y="400" width="280" height="116" rx="16" fill="#0EA5E9" fill-opacity="0.09"/>
<rect x="1100" y="400" width="280" height="116" rx="16" fill="#FF1493" fill-opacity="0.09" stroke="#0EA5E9" stroke-width="1.5"/>
<rect x="1100" y="400" width="280" height="116" rx="16" fill="none" stroke="#FF1493" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="1240" y="444" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Local persistence</text>
<text x="1240" y="468" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">SQLite + session journals</text>
<text x="1240" y="496" font-family="Menlo, Consolas, monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">Tasks, metadata, recovery</text>

<!-- External: Development processes -->
<rect x="60" y="650" width="280" height="116" rx="16" fill="#0B1020"/>
<rect x="60" y="650" width="280" height="116" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.5"/>
<text x="200" y="694" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Development processes</text>
<text x="200" y="718" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">Servers, workers, test watchers</text>
<text x="200" y="746" font-family="Menlo, Consolas, monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle">One managed process per role</text>

<!-- External: Installed agent CLIs -->
<rect x="560" y="920" width="320" height="116" rx="16" fill="#0B1020"/>
<rect x="560" y="920" width="320" height="116" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.5"/>
<text x="720" y="964" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Installed agent CLIs</text>
<text x="720" y="988" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">Claude, Codex, other tools</text>
<text x="720" y="1016" font-family="Menlo, Consolas, monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.45" text-anchor="middle">Their own auth + permissions</text>

<!-- Cloud: Model providers -->
<rect x="1100" y="920" width="280" height="116" rx="16" fill="#0B1020"/>
<rect x="1100" y="920" width="280" height="116" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1240" y="964" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="middle">Model providers</text>
<text x="1240" y="988" font-size="13.5" fill="#FFFFFF" fill-opacity="0.65" text-anchor="middle">Agent connects directly</text>
<text x="1240" y="1016" font-family="Menlo, Consolas, monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">Outside your local runtime</text>

