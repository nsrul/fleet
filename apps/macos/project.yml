name: Fleet
options:
  bundleIdPrefix: dev.fleet
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FleetKit:
    path: FleetKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1

targets:
  Fleet:
    type: application
    platform: macOS
    sources:
      - path: Fleet
        excludes:
          - "Info.plist"
          - "Resources/Icons"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fleet.macos
        PRODUCT_NAME: Fleet
        INFOPLIST_FILE: Fleet/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: FleetKit
        product: FleetAPI
      - package: SwiftTerm
        product: SwiftTerm
    postBuildScripts:
      - name: Copy fleet-daemon
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${SRCROOT}/../../target/release/fleet-daemon"
          if [ ! -x "$SRC" ]; then
            SRC="${SRCROOT}/../../target/debug/fleet-daemon"
          fi
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST"
          if [ -x "$SRC" ]; then
            cp "$SRC" "$DEST/fleet-daemon"
            chmod +x "$DEST/fleet-daemon"
            echo "Copied fleet-daemon from $SRC"
          else
            echo "warning: fleet-daemon is not built; the app will search target/debug and PATH"
          fi

schemes:
  Fleet:
    build:
      targets:
        Fleet: all
    run:
      config: Debug
    test:
      config: Debug
